services:
  t3code-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: t3code-server:latest
    container_name: t3code-server
    restart: unless-stopped

    # ============================================================================
    # Security Isolation
    # ============================================================================
    # CRITICAL ANTI-ESCAPE GUARANTEE:
    # The host docker socket (/var/run/docker.sock) is NEVER mounted.
    # Coding agents are strictly sandboxed inside this container and cannot touch the host OS.
    #
    # Note: 'no-new-privileges:true' and 'cap_drop: ALL' are omitted so that
    # 'ENABLE_SUDO=true' allows agents to dynamically install packages (e.g. PHP, Composer, Python, etc.)
    # via passwordless sudo. If you require ultra-strict lockdown without any package installation,
    # set ENABLE_SUDO=false in .env.

    # ============================================================================
    # Resource Limitations (Prevent host freeze, OOM, and fork bombs)
    # ============================================================================
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT:-4.0}'
          memory: '${MEMORY_LIMIT:-8G}'
          pids: ${PIDS_LIMIT:-500}
        reservations:
          cpus: '0.5'
          memory: '${MEMORY_RESERVATION:-2G}'

    pids_limit: ${PIDS_LIMIT:-500}

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    # ============================================================================
    # Port Forwarding
    # ============================================================================
    ports:
      # SSH Server (for T3 Code Desktop remote connection: coder@<ip>:2222)
      - "${SSH_PORT:-2222}:22"
      # T3 Code Server (for direct browser pairing and app.t3.codes)
      - "${T3_PORT:-3773}:3773"
      # OpenCode Web UI (browser interface for OpenCode AI)
      - "${OPENCODE_PORT:-4096}:4096"

    # ============================================================================
    # Environment Variables
    # ============================================================================
    env_file:
      - path: .env
        required: false
    environment:
      - CODER_PASSWORD=${CODER_PASSWORD:-coder_secure_pass_2026}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-opencode_secure_web_pass_2026}
      - SSH_PUBLIC_KEY=${SSH_PUBLIC_KEY:-}
      - ENABLE_SUDO=${ENABLE_SUDO:-true}
      - T3CODE_HOST=${T3CODE_HOST:-0.0.0.0}
      - T3CODE_PORT=${T3_PORT:-3773}
      - OPENCODE_HOSTNAME=${OPENCODE_HOSTNAME:-0.0.0.0}
      - OPENCODE_PORT=${OPENCODE_PORT:-4096}
      - ENABLE_OPENCODE_WEB=${ENABLE_OPENCODE_WEB:-false}
      - GIT_USER_NAME=${GIT_USER_NAME:-iDevakk}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-219866223+idevakk@users.noreply.github.com}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GH_TOKEN=${GH_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}

    # ============================================================================
    # Persistent Storage (Survives container rebuilds, updates, and redeployments)
    # ============================================================================
    volumes:
      # All code projects, git repos, and T3 worktrees reside here
      - ${WORKSPACE_PATH:-./workspace}:/workspace
      # Preserves T3 Code SQLite database (~/.t3/state.sqlite), threads, OpenCode settings, and SSH keys
      - ${CODER_HOME_PATH:-./data/coder_home}:/home/coder
      # Preserves server SSH host identification keys
      - ${SSH_KEYS_PATH:-./data/ssh_host_keys}:/etc/ssh/ssh_host_keys

    # Fast temporary memory
    tmpfs:
      - /tmp:size=1G,exec
      - /run:size=100M
