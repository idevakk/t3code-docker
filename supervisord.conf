[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/sshd.out.log
stderr_logfile=/var/log/supervisor/sshd.err.log

[program:t3code]
command=/usr/local/bin/run-t3.sh
user=coder
directory=/workspace
autostart=true
autorestart=true
priority=20
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/t3code.out.log
stderr_logfile=/var/log/supervisor/t3code.err.log

[program:opencode]
command=/usr/local/bin/run-opencode.sh
user=coder
directory=/workspace
autostart=false
autorestart=true
priority=30
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/opencode.out.log
stderr_logfile=/var/log/supervisor/opencode.err.log
